name: Release Logbook CLI

on:
  push:
    branches:
      - main
    paths:
      - 'tools/logbook_cli/**'
      - '.github/workflows/release-cli.yml'

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: logbook-cli-linux-x64
            binary_name: logbook_cli
            is_windows: false
          - os: windows-latest
            artifact_name: logbook-cli-windows-x64
            binary_name: logbook_cli.exe
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build with PyInstaller (Linux)
        if: matrix.is_windows == false
        run: |
          pyinstaller --onefile --name logbook_cli tools/logbook_cli/logbook_cli.py
          mkdir -p dist_pkg
          cp dist/logbook_cli dist_pkg/
          cp tools/logbook_cli/config.example.json dist_pkg/
          cp tools/logbook_cli/README.md dist_pkg/
          cd dist_pkg && zip -r ../${{ matrix.artifact_name }}.zip .

      - name: Build with PyInstaller (Windows)
        if: matrix.is_windows == true
        shell: pwsh
        run: |
          pyinstaller --onefile --name logbook_cli tools/logbook_cli/logbook_cli.py
          New-Item -ItemType Directory -Path dist_pkg -Force
          Copy-Item dist/logbook_cli.exe dist_pkg/
          Copy-Item tools/logbook_cli/config.example.json dist_pkg/
          Copy-Item tools/logbook_cli/README.md dist_pkg/
          Compress-Archive -Path dist_pkg/* -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: Publish Release (cli-latest)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-latest
          name: "Logbook CLI (Latest)"
          body: |
            ## 🚀 Logbook CLI Pre-built Packages

            Paket executable mandiri (standalone binary) untuk Logbook CLI Git automation. Anda tidak perlu menginstal Python di laptop untuk menjalankannya.

            ### 📦 Unduhan Langsung
            - 🪟 **Windows (x64)**: [`logbook-cli-windows-x64.zip`](https://github.com/Oktavian19/bot-services/releases/download/cli-latest/logbook-cli-windows-x64.zip)
            - 🐧 **Linux (x64)**: [`logbook-cli-linux-x64.zip`](https://github.com/Oktavian19/bot-services/releases/download/cli-latest/logbook-cli-linux-x64.zip)

            ### 📝 Cara Penggunaan Singkat
            1. Unduh dan ekstrak file ZIP sesuai sistem operasi Anda.
            2. Salin template `config.example.json` menjadi `config.json`.
            3. Masukkan `api_token` yang didapatkan dari bot Telegram (perintah `/token_logbook` atau `/daftar_logbook`).
            4. Atur path repositori git Anda pada bagian `repositories`.
            5. Jalankan melalui terminal / PowerShell:
               - **Windows**: `.\logbook_cli.exe run`
               - **Linux**: `./logbook_cli run`

            Lihat `README.md` di dalam paket untuk petunjuk penjadwalan harian otomatis (Task Scheduler di Windows, systemd timer / cron di Linux).
          draft: false
          prerelease: false
          files: release_assets/*.zip
